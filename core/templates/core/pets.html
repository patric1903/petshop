{% extends "core/base.html" %}
{% block content %}
<div class="d-flex justify-content-between mb-3"><h4>Pets</h4>
  <a class="btn btn-primary" href="{% url 'pet_novo' %}">Novo pet</a></div>
<form class="mb-3"><input name="q" value="{{ q }}" class="form-control" placeholder="Buscar por pet ou tutor"></form>
<table class="table table-hover bg-white shadow-sm">
  <thead><tr><th>Pet</th><th>Espécie</th><th>Raça</th><th>Tutor</th><th></th></tr></thead>
  {% for p in pets %}
  <tr><td><a href="{% url 'pet_historico' p.pk %}">{{ p.nome }}</a></td><td>{{ p.get_especie_display }}</td>
    <td>{{ p.raca }}</td><td>{{ p.cliente.nome }}</td>
    <td class="text-end"><a class="btn btn-sm btn-success" href="{% url 'agendar' %}?pet={{ p.pk }}">Agendar</a>
      <a class="btn btn-sm btn-outline-primary" href="{% url 'pet_editar' p.pk %}">Editar</a>
      <a class="btn btn-sm btn-outline-danger" href="{% url 'pet_excluir' p.pk %}">Excluir</a></td></tr>
  {% empty %}<tr><td colspan="5" class="text-muted">Nenhum pet encontrado.</td></tr>{% endfor %}
</table>
{% endblock %}
