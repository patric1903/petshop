{% extends "core/base.html" %}
{% block content %}
<div class="card shadow-sm col-md-6 mx-auto"><div class="card-body">
  <h5>Excluir {{ nome|lower }}?</h5>
  <p>Você vai excluir <strong>{{ obj }}</strong>. Essa ação não pode ser desfeita.</p>
  <form method="post">{% csrf_token %}
    <button class="btn btn-danger">Confirmar exclusão</button>
    <a class="btn btn-link" href="{% url voltar %}">Voltar</a>
  </form>
</div></div>
{% endblock %}
